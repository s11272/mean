[project]
name = "mean_qa_framework"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.0",
    "pytest-bdd>=7.3.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "selenium>=4.25.0",
    "playwright>=1.47.0",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v -s --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]